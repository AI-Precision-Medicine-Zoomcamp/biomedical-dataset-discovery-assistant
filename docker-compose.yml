services:
  api:
    build: .
    command: python -m src.api --host 0.0.0.0 --port 8000 --catalog data/processed/catalog.json
    ports:
      - "8000:8000"
    volumes:
      - ./data/feedback:/app/data/feedback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
  reviewer-ui:
    build: .
    command:
      - streamlit
      - run
      - src/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./data/feedback:/app/data/feedback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
